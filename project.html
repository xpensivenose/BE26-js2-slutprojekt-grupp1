		<!-- Filter, sortering, ny uppgift -->
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
			<div class="d-flex flex-wrap gap-2">
				<select id="filter-category" class="form-select w-auto">
					<option value="">Alla kategorier</option>
					<option value="frontend">Frontend</option>
					<option value="backend">Backend</option>
					<option value="ux">UX</option>
				</select>
				<select id="filter-member" class="form-select w-auto">
					<option value="">Alla medlemmar</option>
				</select>
				<select id="sort" class="form-select w-auto">
					<option value="deadline-asc">Deadline stigande</option>
					<option value="deadline-desc">Deadline fallande</option>
					<option value="title-asc">Titel A → Ö</option>
					<option value="title-desc">Titel Ö → A</option>
				</select>
			</div>
			<button class="btn btn-primary">+ Ny uppgift</button>
		</div>

		<!-- Task board -->
		<div class="row g-3">
			<section class="col-md-4">
				<div class="bg-body-secondary rounded p-3">
					<h2 class="h6">Ny (<span id="count-new">1</span>)</h2>
					<!-- Task cards are rendered dynamically via JavaScript -->
					<div id="column-new"></div>
				</div>
			</section>

			<section class="col-md-4">
				<div class="bg-body-secondary rounded p-3">
					<h2 class="h6">Pågående (<span id="count-ongoing">1</span>)</h2>
					<!-- Task cards are rendered dynamically via JavaScript -->
					<div id="column-ongoing"></div>
				</div>
			</section>

			<section class="col-md-4">
				<div class="bg-body-secondary rounded p-3">
					<h2 class="h6">Slutförd (<span id="count-done">1</span>)</h2>
